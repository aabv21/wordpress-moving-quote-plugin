version: 2
updates:
  # npm ecosystem also reads the pnpm lockfile.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # NOTE: @types/node follows the Node LTS major (24), not npm's latest; bumping it ahead of
      # the runtime would type-check against APIs this project's Node doesn't have. Move it by
      # hand when the project itself moves to a newer Node LTS major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # NOTE: typescript 7 is the native port with no classic compiler API, and typescript-eslint
      # 8.x requires a typescript version below 6.1. Move both together by hand once
      # typescript-eslint supports typescript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

  - package-ecosystem: docker
    directory: /docker/php
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # NOTE: the plugin targets PHP 8.3, matching the root composer.json's config.platform.php;
      # a minor or major bump here would silently retarget that platform. Patch updates still
      # come through; a PHP version bump is reviewed and pinned by hand together with that file.
      - dependency-name: php
        update-types: ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # NOTE: n8n publishes beta and stable releases under the same plain semver tag scheme (no
      # -beta suffix), so Dependabot can't tell them apart from the tag alone. Patch bumps still
      # come through; minor/major bumps to n8nio/n8n are reviewed and pinned by hand.
      - dependency-name: n8nio/n8n
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # NOTE: a Postgres major version can't start on a data directory from the previous major
      # without pg_upgrade, so a major bump would break every existing local volume. Minor and
      # patch updates still come through; a major upgrade is planned by hand with a dump/restore.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
      # NOTE: the stack targets MySQL 8.4 LTS; a minor or major bump would move off that LTS line.
      # Patch updates still come through; a MySQL version bump is reviewed and pinned by hand.
      - dependency-name: mysql
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # NOTE: compose.yaml pins two tag families of the one `wordpress` image (the server's
      # `7.x-php8.3-apache` and WP-CLI's `cli-2.x-php8.3`), which fails Dependabot's update with
      # `unknown_error`. Bump both by hand, re-resolving each digest, until it handles mixed families.
      - dependency-name: wordpress
