name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build:assets -- --check
      - run: pnpm run build:workflows -- --check
      - run: pnpm run check
      - name: ShellCheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -gt 0 ]; then
            docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d "${files[@]}"
          fi
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.11.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer audit --locked --abandoned=fail
      - run: composer lint
      - run: composer analyse
      - run: composer test
      - name: Check committed autoloader is up to date
        run: |
          composer autoload:plugin
          git diff --exit-code -- plugin/moving-quote/vendor

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source . --redact --exit-code 1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - name: composer audit
        run: docker run --rm -v "$PWD:/app" -w /app composer:2.11.0@sha256:278dfc7bd35169965d03f87194816f43bf4e6b6ea61707c2114e52ad12fe24ce audit --locked --abandoned=fail

  actions:
    name: Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        run: |
          pip install --require-hashes -r .github/zizmor-requirements.txt
          zizmor --format=plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stack:
    name: Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/init-env.ts
      - run: cp config/config.example.json config/config.json
      - run: docker compose up -d --wait db wordpress wpcli postgres n8n
      # Regenerates the .pot with the stack's own pinned WP-CLI (no network: it reads only the
      # plugin's PHP), and rebuilds the .mo and .l10n.php from each committed .po; fails when any
      # of them differs from what's committed, ignoring only the .pot's POT-Creation-Date.
      - name: Translation files match the plugin's strings
        run: pnpm run i18n -- --check
      - run: ./setup.sh
      - run: pnpm run setup
      - run: pnpm run test:stack
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs wordpress
          docker compose logs wpcli
          docker compose logs n8n
          docker compose logs postgres
      - name: Tear down
        if: always()
        run: docker compose down -v
