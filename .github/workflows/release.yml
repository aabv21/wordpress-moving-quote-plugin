name: Release

# A merged pull request into main titled `release: vX.Y.Z` (optionally followed by a summary)
# gets the tag vX.Y.Z on its merge commit and a GitHub release with generated notes.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Tag and publish
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'release:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # creates the tag and the release
    steps:
      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version=$(printf '%s' "$TITLE" | sed -nE 's/^release: (v[0-9]+\.[0-9]+\.[0-9]+)([ :].*)?$/\1/p')
          if [ -z "$version" ]; then
            echo "::notice::No vX.Y.Z after 'release: ' in the title, so no tag or release was made."
            exit 0
          fi
          gh release create "$version" --repo "$REPO" --target "$SHA" --title "$version" --generate-notes
