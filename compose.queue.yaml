x-queue-env: &queue-env
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

services:
  # NOTE: Redis is reachable only on the Compose network (no published port, no password); add
  # QUEUE_BULL_REDIS_PASSWORD before running this in production.
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  n8n:
    environment:
      <<: *queue-env
    depends_on:
      redis:
        condition: service_healthy

  n8n-worker:
    extends:
      file: compose.yaml
      service: n8n
    command: worker
    ports: !reset []
    environment:
      <<: *queue-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
