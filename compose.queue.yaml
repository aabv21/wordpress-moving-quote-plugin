x-queue-env: &queue-env
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

services:
  # NOTE: Redis is reachable only on the Compose network (no published port, no password); add
  # QUEUE_BULL_REDIS_PASSWORD before running this in production.
  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  n8n:
    environment:
      <<: *queue-env
    depends_on:
      redis:
        condition: service_healthy

  n8n-worker:
    extends:
      file: compose.yaml
      service: n8n
    command: worker
    ports: !reset []
    environment:
      <<: *queue-env
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
