name: chivabox-movers

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
  WORDPRESS_DB_USER: ${MYSQL_USER}
  WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
  WORDPRESS_DEBUG: "1"
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );
    define( 'DISABLE_WP_CRON', true );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );

x-wordpress-volumes: &wordpress-volumes
  - wp_data:/var/www/html
  - ./plugin/moving-quote:/var/www/html/wp-content/plugins/moving-quote:ro

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    profiles: [tools]
    volumes:
      - .:/app
    working_dir: /app

  db:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # `-h 127.0.0.1` forces a TCP connection. The 8.4 entrypoint's temporary init server only
      # listens on its Unix socket, so a plain `mysqladmin ping` (which also exits 0 on "Access
      # denied") would report healthy before the real server accepts connections.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:7.1.4-php8.3-apache@sha256:12ec50e21cb81a5ea964669d434578b7da4a101a45aef83f5f1c2227bcd1b058
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:80
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wordpress-env
    volumes: *wordpress-volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/wp-includes/images/blank.gif') === false ? 1 : 0);"]
      interval: 5s
      retries: 20

  wpcli:
    image: wordpress:cli-2.12.0-php8.3@sha256:6bcc7bb91f5157c4b915e74ee131873e99c1c1ff48f602e4a6f6cd17827305cb
    restart: unless-stopped
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wordpress-volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    entrypoint: ["tail", "-f", "/dev/null"]

  cron:
    image: wordpress:cli-2.12.0-php8.3@sha256:6bcc7bb91f5157c4b915e74ee131873e99c1c1ff48f602e4a6f6cd17827305cb
    restart: unless-stopped
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      <<: *wordpress-env
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wordpress-volumes
    extra_hosts:
      - host.docker.internal:host-gateway
    entrypoint: ["sh", "-c", "while :; do wp cron event run --due-now --quiet; sleep 60; done"]

  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/schema.sql:/schema/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.45.6@sha256:45edf89655fd66dd55ea9336c1791ad14777599fdbf6c5aec6db583ede99a40b
    restart: unless-stopped
    ports:
      - 127.0.0.1:5678:5678
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/files/config:ro
      - ./workflows:/workflows:ro
      - ./.n8n-import:/import
    healthcheck:
      # wget is present on every n8n image tag seen so far; the Node one-liner is the fallback
      # for a future base image that drops it.
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || node -e \"require('http').get('http://localhost:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      retries: 20

volumes:
  db_data:
  wp_data:
  pgdata:
  n8n_data:
